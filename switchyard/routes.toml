# Task preset "quality": Opus unless Haiku is near-certain: below 97% (98.5/100% when unsure).
[routes.task_quality]
id = "switchyard/task-quality"
type = "llm_classifier"
mode = "capability"
classifier_target = "judge"
weak_target = "haiku"
strong_target = "opus"
base_threshold = 0.97
threshold_step = 0.015
classify_trigger = "every_request"
max_output_tokens = 2048
judge_deadline_ms = 20000
prompt = """
You are a router's judge for a chat assistant. Estimate p_solve: the probability that
Claude Haiku 5.5 (a fast, low-cost model) answers the LATEST user message correctly and
