# Tiered preset "thrifty": leans cheap; Haiku is the default, Opus only for clearly hard reasoning.
[routes.tiered_thrifty]
id = "switchyard/tiered-thrifty"
type = "llm_classifier"
mode = "custom"
default_target = "sonnet"
classify_trigger = "every_request"
max_output_tokens = 2048
judge_deadline_ms = 20000
prompt = """
You route chat requests to one of three Claude models. Judge the LATEST user message
and pick the CHEAPEST model that gives an acceptable answer; when unsure, choose the cheaper model. Earlier messages, including the
conversation's opening message, are context only: use them only when the latest message
depends on them (for example "explain that more simply"). A hard earlier question does not
make a simple new one hard.

- "haiku": the default. Facts, definitions, rewrites, translations, formatting, and standard
  explanations or summaries of well-known topics, even multi-paragraph ones.
- "sonnet": only when the answer needs real nuance or judgement across several factors, or
  non-trivial code, and a fast model would probably produce something noticeably weaker.
- "opus": only for hard multi-step reasoning, maths or logic puzzles, or deep debugging and
  system design where both cheaper models would likely get it wrong.

Return JSON matching the response schema supplied with the request.
"""
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": { "type": "string", "enum": ["haiku", "sonnet", "opus"] }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.tiered_thrifty.models]
judge = ["judge"]
haiku = ["haiku"]
sonnet = ["sonnet"]
opus = ["opus"]
any = ["haiku", "sonnet", "opus"]

[routes.tiered_thrifty.policy]
type = "target_selector"
selector = "/decision/target"

# Tiered preset "quality": leans capable; Sonnet for explanations, Opus for anything non-trivial.
[routes.tiered_quality]
id = "switchyard/tiered-quality"
type = "llm_classifier"
mode = "custom"
default_target = "sonnet"
classify_trigger = "every_request"
max_output_tokens = 2048
judge_deadline_ms = 20000
prompt = """
You route chat requests to one of three Claude models. Judge the LATEST user message
and pick the model that gives the BEST answer; when unsure, choose the more capable model. Earlier messages, including the
conversation's opening message, are context only: use them only when the latest message
depends on them (for example "explain that more simply"). A hard earlier question does not
make a simple new one hard.

- "haiku": only for a single trivial fact, a one-line rewrite, translation or spelling fix.
- "sonnet": explanations, summaries and comparisons of well-documented topics.
- "opus": anything involving reasoning, calculation, code (writing or debugging), design,
  trade-offs, multi-part questions, or any answer where a subtle mistake would matter.

Return JSON matching the response schema supplied with the request.
"""
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": { "type": "string", "enum": ["haiku", "sonnet", "opus"] }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.tiered_quality.models]
judge = ["judge"]
haiku = ["haiku"]
sonnet = ["sonnet"]
opus = ["opus"]
any = ["haiku", "sonnet", "opus"]

[routes.tiered_quality.policy]
type = "target_selector"
selector = "/decision/target"
